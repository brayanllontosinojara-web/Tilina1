<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Cinzel+Decorative:wght@600;700&family=Metamorphous&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --panel:#181818;
    --panel-hover:#242424;
    --red:#e50914;
    --red-dark:#8b060c;
    --white:#ffffff;
    --gray:#b3b3b3;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    width:100%; height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Inter', sans-serif;
    font-size:16.5px;
    line-height:1.55;
    overflow:hidden;
  }

  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center;
    justify-content:flex-start;
    justify-content:safe center; 
    flex-direction:column;
    transition: opacity .6s ease;
    overflow-y:auto; 
    padding:30px 0;
  }
  .hidden{ opacity:0; pointer-events:none; visibility:hidden; }
  .visible{ opacity:1; pointer-events:auto; visibility:visible; }

  /* ---------- PANTALLA DE INICIO ---------- */
  #startScreen {
  background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
}

.start-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.vinyl-record {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: repeating-radial-gradient(#111, #111 2px, #222 3px, #222 4px);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.8);
  animation: spin 10s linear infinite;
}

.vinyl-center {
  width: 40px;
  height: 40px;
  background: var(--red);
  border-radius: 50%;
  border: 4px solid #fff;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.start-title {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: .2em;
  font-size: 1.2rem;
  color: var(--gray);
}

.custom-play-btn {
  background: #222;
  border: 1px solid #444;
  color: var(--white);
  padding: 12px 28px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}

.custom-play-btn:hover {
  background: var(--red);
  border-color: var(--red);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(229,9,20,0.4);
}

  /* ---------- INTRO ---------- */
  #introScreen{ background:var(--black); }
  .logo-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
  .logo-bar{
    width:10px; height:0; background:var(--red);
    border-radius:2px;
    animation: growBar 900ms cubic-bezier(.2,.8,.2,1) forwards;
    box-shadow:0 0 60px 10px rgba(229,9,20,.5);
  }
  @keyframes growBar{
    0%{ height:0; opacity:0;}
    50%{ height:160px; opacity:1;}
    100%{ height:160px; opacity:0;}
  }
  .logo-text{
    position:absolute;
    font-family:'Bebas Neue', sans-serif;
    font-size:clamp(2.2rem, 8vw, 4.5rem);
    letter-spacing:.12em;
    color:var(--red);
    opacity:0;
    text-shadow:0 0 30px rgba(229,9,20,.6);
    animation: revealText 1.4s ease-out forwards;
    animation-delay:.55s;
    white-space:nowrap;
    text-align:center;
  }
  @keyframes revealText{
    0%{ opacity:0; letter-spacing:.5em; transform:scale(1.15);}
    100%{ opacity:1; letter-spacing:.12em; transform:scale(1);}
  }

  /* ---------- PERFILES ---------- */
  #profilesScreen{ background:var(--black); }
  .profiles-eyebrow{
    font-family:'Bebas Neue', sans-serif;
    color:var(--red);
    letter-spacing:.2em;
    font-size:.85rem;
    margin-bottom:10px;
  }
  #profilesScreen h1{
    font-size:clamp(1.6rem, 4vw, 2.4rem);
    font-weight:600;
    margin-bottom:40px;
    text-align:center;
  }
  .profile-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:32px;
    max-width:780px;
    padding:0 20px;
  }
  .profile-card{
    display:flex; flex-direction:column; align-items:center;
    gap:12px; cursor:pointer;
    width:120px;
  }
  .avatar{
    width:120px; height:120px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    border:3px solid transparent;
    position:relative;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    overflow:hidden;
  }
  .avatar svg{ width:46px; height:46px; fill:var(--white); z-index:2; }
  .avatar::after{
    content:'';
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.18), transparent 70%);
    opacity:0; transition:opacity .2s ease;
  }
  .profile-card:hover .avatar{
    transform:scale(1.07);
    border-color:var(--white);
    box-shadow:0 0 25px 4px rgba(229,9,20,.45);
  }
  .profile-card:hover .avatar::after{ opacity:1; }
  .profile-card span{
    color:var(--gray);
    font-size:.95rem;
    font-weight:500;
    transition:color .2s ease;
  }
  .profile-card:hover span{ color:var(--white); }

  /* ---------- MODAL ---------- */
  #modalOverlay{
    background:var(--black);
    align-items:flex-start;
    flex-direction:column;
    z-index:50;
  }
  .modal-header{
    width:100%;
    display:flex; align-items:center; gap:18px;
    padding:26px 5%;
    border-bottom:1px solid #2a2a2a;
  }
  .back-btn{
    height:42px; border-radius:21px; border:none;
    background:var(--panel);
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:0 18px 0 14px;
    cursor:pointer; transition:background .2s ease, transform .15s ease;
    flex-shrink:0;
  }
  .back-btn:hover{ background:var(--panel-hover); transform:translateX(-2px); }
  .back-btn svg{ width:20px; height:20px; fill:var(--white); flex-shrink:0; }
  .back-btn span{ color:var(--white); font-size:.9rem; font-weight:600; }
  .modal-avatar-mini{
    width:44px; height:44px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; overflow:hidden;
  }
  .modal-avatar-mini img{ width:100%; height:100%; object-fit:cover; }
  .modal-header h2{ font-size:1.3rem; font-weight:600; }

  #modalBody{
    width:100%; flex:1;
    display:flex;
    align-items:flex-start; 
    align-items:safe center; 
    justify-content:center;
    padding:40px 5%;
    text-align:center;
    overflow-y:auto;
  }

  /* ---------- FRASCO DE PAPELITOS (perfil "Sorpresas") ---------- */
  .frasco-wrap{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    position:relative; width:100%; max-width:420px; margin:0 auto;
    padding-top:6px;
  }
  .frasco-hint{ color:var(--gray); font-size:.92rem; font-weight:500; text-align:center; }
  .frasco-jar-zone{
    position:relative; width:200px; height:230px;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .frasco-jar{
    width:190px; height:210px; cursor:pointer; user-select:none;
    animation:frascoSway 4s ease-in-out infinite;
    transform-origin:50% 96%;
    transition:opacity .3s ease, filter .3s ease;
  }
  .frasco-jar svg{ width:100%; height:100%; display:block; overflow:visible; }
  .frasco-jar.frasco-shake{ animation:frascoShakeKeyframe .5s ease; }
  .frasco-jar.frasco-busy{ pointer-events:none; }
  .frasco-jar.frasco-empty{ opacity:.5; filter:grayscale(.5); cursor:default; pointer-events:none; }
  @keyframes frascoSway{
    0%,100%{ transform:rotate(-1.4deg); }
    50%{ transform:rotate(1.4deg); }
  }
  @keyframes frascoShakeKeyframe{
    0%,100%{ transform:rotate(0deg); }
    20%{ transform:rotate(-9deg); }
    40%{ transform:rotate(8deg); }
    60%{ transform:rotate(-5deg); }
    80%{ transform:rotate(3deg); }
  }
  .frasco-counter{
    font-family:'Inter', sans-serif; font-weight:700; font-size:.98rem; color:var(--white);
    background:var(--panel); padding:6px 16px; border-radius:20px;
  }
  .frasco-reset-btn{
    background:transparent; border:1px solid #555; color:var(--gray);
    padding:6px 14px; border-radius:16px; font-size:.8rem; font-weight:600; cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .frasco-reset-btn:hover{ border-color:var(--red); color:var(--white); }
  .frasco-paper-zone{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:260px; height:1px; display:flex; justify-content:center; pointer-events:none;
  }
  .frasco-paper{
    position:absolute; bottom:0; max-width:230px;
    background:#faf6e9; color:#2b2313; padding:14px 16px;
    border-radius:4px; box-shadow:0 10px 26px rgba(0,0,0,.45);
    font-family:'Inter', sans-serif; font-weight:600; font-size:.9rem; line-height:1.45;
    text-align:center; transform:translateY(10px) rotate(-2deg) scale(.9);
    opacity:0; transition:opacity .45s ease, transform .45s ease;
  }
  .frasco-paper.frasco-paper-show{
    opacity:1; transform:translateY(-130px) rotate(-1.5deg) scale(1);
  }
  .frasco-paper.frasco-paper-hide{
    opacity:0; transform:translateY(-165px) rotate(2deg) scale(.92);
  }

  /* ---------- CONFETI (celebración del pastel, perfil "Recuerdos") ---------- */
  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:400;
  }
  .confetti-piece{
    position:absolute; top:-20px; width:8px; height:14px; opacity:.95;
    animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(100vh) rotate(600deg); opacity:0; }
  }

  /* ---------- MEOWL GIGANTE (perfil "Recuerdos") ---------- */
  .recuerdos-wrap{
    display:flex; flex-direction:column; align-items:center;
    width:100%; max-width:520px; margin:0 auto;
  }
  .meowl-view, .cake-view{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width:100%;
  }
  .meowl-view.hide, .cake-view{ display:none; }
  .cake-view.show{ display:flex; }

  .recuerdos-hint{ color:var(--gray); font-size:.92rem; font-weight:500; text-align:center; }
  .meowl-zone{
    position:relative; width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
  }
  .meowl-avatar{
    width:240px; height:240px; border-radius:50%;
    background:url('img/meowl.png') center/contain no-repeat;
    cursor:pointer; user-select:none;
    transition:filter .2s ease;
  }
  .meowl-avatar:hover{ filter:brightness(1.08); }
  .meowl-avatar.wiggle{ animation: meowlWiggle .4s ease; }
  @keyframes meowlWiggle{
    0%,100%{ transform:translateX(0) scaleX(1); }
    25%{ transform:translateX(-8px) scaleX(1.04); }
    50%{ transform:translateX(6px) scaleX(0.96); }
    75%{ transform:translateX(-4px) scaleX(1.02); }
  }
  .meowl-hearts{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .meowl-heart{
    position:absolute; left:50%; top:22%; font-size:1.5rem;
    transform:translate(-50%, 0); opacity:0;
    transition:opacity .6s ease, transform .6s ease;
  }
  .meowl-heart.show{ opacity:1; transform:translate(-50%, -46px); }
  .meowl-heart.hide{ opacity:0; transform:translate(-50%, -74px); }
  .meowl-counter{
    font-family:'Inter', sans-serif; font-weight:700; font-size:1rem; color:var(--white);
    background:var(--panel); padding:6px 16px; border-radius:20px;
  }

  /* ---------- ESCENARIO DEL PASTEL (segunda vista, toma toda la pantalla del perfil) ---------- */
  .cake-back-btn{
    align-self:flex-start;
    background:transparent; border:1px solid #555; color:var(--gray);
    padding:6px 14px; border-radius:16px; font-size:.8rem; font-weight:600; cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .cake-back-btn:hover{ border-color:var(--red); color:var(--white); }

  .cake-stage{
    position:relative; width:100%; max-width:420px;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:85px;
  }
  .balloon-layer{
    position:absolute; inset:0; overflow:visible; pointer-events:none; z-index:1;
  }
  .balloon{
    position:absolute; bottom:0; width:32px; height:42px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: balloonRise 3.4s ease-in forwards;
  }
  .balloon::after{
    content:''; position:absolute; left:50%; bottom:-26px; width:1px; height:26px;
    background:rgba(255,255,255,.5); transform:translateX(-50%);
  }
  @keyframes balloonRise{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(-220px) rotate(8deg); opacity:0; }
  }
  /* Levi, asomado detrás del pastel, como si estuviera parado en la mesa */
  .levi-behind-cake{
    position:absolute; 
    top:-30px; /* Ajustamos para que suba y sobresalga más al ser grande */
    left:53%;
    transform:translateX(-50%);
    width:55%; /* Aumentado (antes era 32%) */
    max-width:260px; /* Aumentado (antes era 140px) */
    height:auto;
    z-index:1; /* Mantiene a Levi detrás del pastel */
    pointer-events:none; /* Asegura que los clics traspasen la imagen y lleguen a las velas */
    filter:drop-shadow(0 10px 14px rgba(0,0,0,.5));
  }
  .cake-svg-big{
    position:relative; z-index:2;
    width:100%; max-width:380px; height:auto;
    filter:drop-shadow(0 16px 26px rgba(0,0,0,.55));
  }
  .cake-svg-big.pop-in{ animation: cakePopIn .7s ease; }
  @keyframes cakePopIn{
    0%{ opacity:0; transform:scale(.55) translateY(24px); }
    70%{ opacity:1; transform:scale(1.06) translateY(-6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .cake-caption{
    font-family:'Bebas Neue', sans-serif; letter-spacing:.05em;
    font-size:1.7rem; color:var(--red); text-align:center;
  }
  .cake-subhint{ color:var(--gray); font-size:.88rem; font-weight:500; text-align:center; }

  /* velas: se pueden apagar con click */
  .pvc-candle-group{ cursor:pointer; }
  .candle-flame{ transition:opacity .2s ease; transform-origin:center bottom; }
  .candle-flame.blown{ opacity:0; }
  .candle-smoke{ opacity:0; transition:opacity .2s ease; }
  .candle-smoke.show{ opacity:.55; animation: smokeDrift 1.4s ease forwards; }
  @keyframes smokeDrift{
    0%{ transform:translateY(0) scale(1); opacity:.55; }
    100%{ transform:translateY(-22px) scale(1.6); opacity:0; }
  }

  /* MISHA Y NEGRO: aparecen de golpe a los costados del pastel al apagar la última vela */
  .cake-pet{
    position:absolute; bottom:12%; z-index:3;
    width:25%; max-width:104px; height:auto;
    border-radius:8px;
    box-shadow:0 10px 20px rgba(0,0,0,.5);
    opacity:0; transform:scale(.2) rotate(0deg);
    transition:opacity .45s cubic-bezier(.34,1.56,.64,1), transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .cake-pet.left{ left:0%; transform-origin:bottom left; }
  .cake-pet.right{ right:0%; transform-origin:bottom right; }
  .cake-pet.show{ opacity:1; transform:scale(1) rotate(0deg); }
  .cake-pet.left.show{ animation: petPopLeft .5s ease; }
  .cake-pet.right.show{ animation: petPopRight .5s ease; }
  @keyframes petPopLeft{
    0%{ transform:scale(.2) rotate(0deg); }
    60%{ transform:scale(1.12) rotate(-8deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes petPopRight{
    0%{ transform:scale(.2) rotate(0deg); }
    60%{ transform:scale(1.12) rotate(8deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  /* ---------- COLLAGE DE FOTOS (perfil "Fotos") ---------- */
  .photo-board{
    position:relative; width:100%; max-width:560px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:26px 22px;
    background:linear-gradient(135deg,#e8ddc7,#d8cbaa);
    border-radius:14px; padding:28px 22px 34px;
    box-shadow:inset 0 0 50px rgba(0,0,0,.12);
  }
  .photo-frame{
    position:relative; background:#fff;
    padding:8% 8% 12% 8%; border-radius:4px;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .photo-frame:hover{
    transform:translateY(-6px) scale(1.05) rotate(0deg) !important;
    box-shadow:0 16px 32px rgba(0,0,0,.5);
    z-index:5;
  }
  .photo-frame.square{ background:#141414; padding:8%; }
  .photo-inner{
    width:100%; aspect-ratio:3/4; overflow:hidden; border-radius:2px;
    position:relative;
  }
  .photo-frame.square .photo-inner{ aspect-ratio:1/1; }
  .photo-inner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-placeholder{ position:relative; width:100%; height:100%; overflow:hidden;
    background:linear-gradient(to bottom, #cfe8f7 0%, #eef7fb 65%); }
  .placeholder-hill{ position:absolute; bottom:-8%; left:-12%; width:124%; height:42%;
    background:#8bc34a; border-radius:50%; }
  .placeholder-plus{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:1.6rem; color:rgba(255,255,255,.85); font-weight:700; }
  .photo-caption{
    margin-top:8px; font-family:'Inter', sans-serif; font-size:.8rem;
    font-weight:500; color:#3a2f22; text-align:center; line-height:1.35;
  }
  @media (min-width:520px){
    .photo-board{ max-width:640px; grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:400px){
    .photo-board{ gap:20px 16px; padding:22px 16px 26px; }
  }

  .photo-lightbox{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .photo-lightbox.active{ opacity:1; pointer-events:auto; }
  .lightbox-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.85); }
  .lightbox-card{
    position:relative; background:#fff; padding:16px 16px 24px;
    border-radius:6px; width:min(90vw, 460px);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    opacity:0; transform:scale(.7);
  }
  .lightbox-card .photo-inner{ aspect-ratio:3/4; }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px;
    border-radius:50%; background:var(--red); color:#fff; border:none;
    font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-caption{
    margin-top:12px; font-weight:500; font-size:.95rem; color:#222; text-align:center; line-height:1.45;
  }

  /* ---------- CARTA CON SOBRE (perfil "Cartas") ---------- */
  .env-wrap{
    font-family:'Metamorphous', serif;
    display:flex; flex-direction:column; align-items:center;
    width:100%;
  }
  .env-envelope-container{
    position:relative; width:320px; height:220px;
    background:#1a1618; border:2px solid #33282c;
    box-shadow:0 10px 30px rgba(0,0,0,.8), 0 0 15px rgba(102,7,8,.3);
    display:flex; justify-content:center; align-items:center;
    cursor:pointer; transition:transform .5s ease, opacity .8s ease;
    z-index:10;
  }
  .env-envelope-flap{
    position:absolute; top:0; left:0; width:0; height:0;
    border-left:160px solid transparent; border-right:160px solid transparent;
    border-top:110px solid #241e21;
    transform-origin:top; transition:transform .6s ease; z-index:3;
  }
  .env-wax-seal{
    position:absolute; width:70px; height:70px;
    background:radial-gradient(circle, #a10e10 0%, #520405 100%);
    border-radius:50%; border:2px solid #d4af37;
    box-shadow:inset 0 0 8px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.7);
    display:flex; justify-content:center; align-items:center;
    z-index:4; transition:transform .3s ease;
  }
  .env-wax-seal::after{ content:"✦"; color:#d4af37; font-size:28px; }
  .env-envelope-container:hover .env-wax-seal{ transform:scale(1.08); }
  .env-instruction{
    position:absolute; bottom:-40px; font-size:.85rem; color:#d4af37;
    letter-spacing:1px; text-align:center; width:100%;
  }
  .env-envelope-container.open .env-envelope-flap{ transform:rotateX(180deg); }
  .env-envelope-container.fade-out{ opacity:0; transform:scale(.8); pointer-events:none; }
  .env-letter-card{
    display:none; opacity:0; max-width:680px; width:100%;
    background:#161214; border:1px solid #33242b;
    box-shadow:0 0 25px rgba(60,9,108,.25), inset 0 0 40px rgba(0,0,0,.8);
    padding:40px 30px; border-radius:4px; position:relative;
    transition:opacity 1s ease; color:#e0e0e0;
  }
  .env-letter-card.show{ display:block; opacity:1; }
  .env-letter-header{
    text-align:center; margin-bottom:30px;
    border-bottom:1px solid #660708; padding-bottom:15px;
  }
  .env-letter-title{
    font-family:'Cinzel Decorative', serif; color:#d4af37;

  envelope.classList.add('open');
  setTimeout(() => {

function renderPhotoBoardHTML(){
  const frames = photoBoard.map((p, i) => `

         onclick="openPhoto(${i})">
      <div class="photo-inner">

      </div>
      ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
    </div>
  `).join('');

  return `
    <div class="photo-board">${frames}</div>
    <div class="photo-lightbox" id="photoLightbox">
      <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
      <div class="lightbox-card" id="lightboxCard">
        <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>

        <p class="lightbox-caption" id="lightboxCaption"></p>

}

function openPhoto(index){
  const data = photoBoard[index];
  const card = document.getElementById('lightboxCard');
  const imgBox = document.getElementById('lightboxImg');
  imgBox.className = data.variant === 'square' ? 'photo-inner' : 'photo-inner';
  imgBox.style.aspectRatio = data.variant === 'square' ? '1/1' : '3/4';
  imgBox.innerHTML = data.src ? `<img src="${data.src}" alt="">` : placeholderMarkup();
  document.getElementById('lightboxCaption').textContent =
    data.caption || '';

  card.style.transition = 'none';
  card.style.transform = `scale(.7) rotate(${data.rotate}deg)`;
  card.style.opacity = '0';
  document.getElementById('photoLightbox').classList.add('active');

  requestAnimationFrame(() => {
    card.style.transition = 'transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s ease';
    card.style.transform = 'scale(1) rotate(0deg)';
    card.style.opacity = '1';
  });
}

function closeLightbox(){
  const lb = document.getElementById('photoLightbox');
  const card = document.getElementById('lightboxCard');
  if(!lb) return;
  card.style.transform = 'scale(.85) rotate(0deg)';
  card.style.opacity = '0';
  lb.classList.remove('active');
}

function recuerdosInit(){
  const avatar = document.getElementById('meowlAvatar');
  if(!avatar) return; // la vista cambió antes de que esto corriera
  meowlState = { pets: 0, celebrated: false, candlesLit: 3 };
  recuerdosUpdateCounter();

  document.getElementById('meowlView').classList.remove('hide');
  document.getElementById('cakeView').classList.remove('show');
  document.getElementById('petMisha').classList.remove('show');
  document.getElementById('petNegro').classList.remove('show');
}

function recuerdosUpdateCounter(){
  const counterEl = document.getElementById('meowlCounter');
  if(!counterEl || !meowlState) return;
  const shown = Math.min(meowlState.pets, 20);
  counterEl.textContent = `${shown} / 20 caricias`;
}

function recuerdosPet(){
  const avatar = document.getElementById('meowlAvatar');
  if(!avatar || !meowlState) return;

  // estirón lateral (como si se acomodara al recibir la caricia)
  avatar.classList.remove('wiggle');
  void avatar.offsetWidth; // fuerza reflow para poder reiniciar la animación
  avatar.classList.add('wiggle');
  setTimeout(() => avatar.classList.remove('wiggle'), 400);

  recuerdosSpawnHeart();

  if(meowlState.pets < 20){
    meowlState.pets++;
    recuerdosUpdateCounter();
    if(meowlState.pets >= 20 && !meowlState.celebrated){
      meowlState.celebrated = true;
      setTimeout(recuerdosCelebrate, 300);
    }
  }
}

function recuerdosSpawnHeart(){
  const layer = document.getElementById('meowlHearts');
  if(!layer) return;
  const heart = document.createElement('div');
  heart.className = 'meowl-heart';
  heart.textContent = '💕';
  heart.style.left = (46 + Math.random() * 8) + '%';
  layer.appendChild(heart);

  requestAnimationFrame(() => heart.classList.add('show'));
  setTimeout(() => {
    heart.classList.remove('show');
    heart.classList.add('hide');
  }, 500);
  setTimeout(() => heart.remove(), 1100);
}

function recuerdosCelebrate(){
  const meowlView = document.getElementById('meowlView');
  const cakeView = document.getElementById('cakeView');
  const cakeSvg = document.getElementById('cakeSvg');
  if(!cakeView) return;

  // el pastel toma toda la pantalla del perfil; Meowl se hace a un lado (no desaparece del código)
  if(meowlView) meowlView.classList.add('hide');
  cakeView.classList.add('show');

  if(cakeSvg){
    cakeSvg.classList.remove('pop-in');
    void cakeSvg.offsetWidth;
    cakeSvg.classList.add('pop-in');
  }

  recuerdosSpawnBalloons();
  recuerdosSpawnConfetti();

  const audio = document.getElementById('recuerdosAudio');
  if(audio){
    audio.currentTime = 0;
    audio.play().catch(() => {
      /* El navegador puede bloquear el audio si aún no existe el archivo,
         o por políticas de autoplay. No pasa nada si falla aquí. */
    });
  }
}

function recuerdosBackToMeowl(){
  const meowlView = document.getElementById('meowlView');
  const cakeView = document.getElementById('cakeView');
  if(cakeView) cakeView.classList.remove('show');
  if(meowlView) meowlView.classList.remove('hide');
}

function apagarVela(groupEl){
  if(!meowlState || groupEl.dataset.blown === 'true') return;
  groupEl.dataset.blown = 'true';

  const flame = groupEl.querySelector('.candle-flame');

function playTadum(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [
      { freq:98,  time:0,    dur:0.35 },
      { freq:73,  time:0.42, dur:0.55 },
    ];
    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + n.time);
      gain.gain.exponentialRampToValueAtTime(0.5, ctx.currentTime + n.time + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n.time + n.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + n.time);
      osc.stop(ctx.currentTime + n.time + n.dur + 0.05);
    });
  }catch(e){ }
}

function frascoShuffle(n){
  const arr = Array.from({length: n}, (_, i) => i);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function frascoGetOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem(FRASCO_ORDER_KEY));
    if(Array.isArray(saved) && saved.length === papelitosFrases.length){
      return saved;
    }
  }catch(e){ /* localStorage corrupto o vacío: se regenera abajo */ }
  const fresh = frascoShuffle(papelitosFrases.length);
  localStorage.setItem(FRASCO_ORDER_KEY, JSON.stringify(fresh));
  return fresh;
}

function frascoGetIndex(){
  const idx = parseInt(localStorage.getItem(FRASCO_INDEX_KEY), 10);
  return Number.isFinite(idx) && idx >= 0 ? idx : 0;
}

function frascoUpdateCounter(order, idx){
  const counterEl = document.getElementById('frascoCounter');
  if(!counterEl) return;
  const total = order.length;
  counterEl.textContent = idx >= total
    ? `Frasco vacío — leíste los ${total} papelitos 🍃`
    : `${idx} de ${total} papelitos leídos`;
}

function frascoInit(){
  const jar = document.getElementById('frascoJar');
  if(!jar) return; // la vista cambió antes de que esto corriera
  const order = frascoGetOrder();
  const idx = frascoGetIndex();
  frascoUpdateCounter(order, idx);
  if(idx >= order.length) jar.classList.add('frasco-empty');
}

function frascoNext(){
  const jar = document.getElementById('frascoJar');
  if(!jar || jar.classList.contains('frasco-busy') || jar.classList.contains('frasco-empty')) return;

  const order = frascoGetOrder();
  const idx = frascoGetIndex();
  if(idx >= order.length){
    jar.classList.add('frasco-empty');
    frascoUpdateCounter(order, idx);
    return;
  }

  jar.classList.add('frasco-busy');
  setTimeout(() => jar.classList.remove('frasco-busy'), 3100);

  const phrase = papelitosFrases[order[idx]];
  const newIdx = idx + 1;
  localStorage.setItem(FRASCO_INDEX_KEY, String(newIdx));

  frascoShakeJar();
  frascoShowPaper(phrase);
  frascoUpdateCounter(order, newIdx);

  if(newIdx >= order.length){
    setTimeout(() => jar.classList.add('frasco-empty'), 500);
  }
}

function frascoShakeJar(){
  const jar = document.getElementById('frascoJar');
  if(!jar) return;
  jar.classList.remove('frasco-shake');
  void jar.offsetWidth; // fuerza reflow para poder reiniciar la animación
  jar.classList.add('frasco-shake');
  setTimeout(() => jar.classList.remove('frasco-shake'), 500);
}

function frascoShowPaper(text){
  const zone = document.getElementById('frascoPaperZone');
  if(!zone) return;
  const paper = document.createElement('div');
  paper.className = 'frasco-paper';
  paper.textContent = text;
  zone.appendChild(paper);

  requestAnimationFrame(() => paper.classList.add('frasco-paper-show'));

  setTimeout(() => {
    paper.classList.remove('frasco-paper-show');
    paper.classList.add('frasco-paper-hide');
  }, 2600);

  setTimeout(() => paper.remove(), 3100);
}

function frascoReset(){
  localStorage.removeItem(FRASCO_ORDER_KEY);
  localStorage.removeItem(FRASCO_INDEX_KEY);

  const jar = document.getElementById('frascoJar');
  const zone = document.getElementById('frascoPaperZone');
  if(zone) zone.innerHTML = '';
  if(jar) jar.classList.remove('frasco-empty', 'frasco-busy', 'frasco-shake');

  const order = frascoGetOrder();
  frascoUpdateCounter(order, 0);
  frascoShakeJar();
}

function pvcRestart(){
  const gridEl = document.getElementById('pvcGrid');
  const entitiesEl = document.getElementById('pvcEntities');
  if(!gridEl) return;
  pvcStopGame();

  if(entitiesEl) entitiesEl.innerHTML = '';
  pvcPlantEls = {}; pvcCombiEls = {}; pvcMowerEls = {}; pvcPeaEls = {}; pvcSunEls = {}; pvcFriendlyEls = {};

  pvcState = {
    rows: 5,
    cols: 9,
    sun: 50,
    selectedSeed: 'girasol',
    paused: false,
    running: true,
    nextId: 1,
    plants: {},      
    combis: [],      
    peas: [],        
    suns: [],        
    mowers: [],
    friendlyUnits: []
  };

  // Inicializar Podadoras
  for(let r = 0; r < 5; r++){
    pvcState.mowers.push({ row: r, xPct: 18.5, active: false, used: false });
  }

  // Generar celdas de la cuadrícula
  gridEl.innerHTML = '';
  for(let r = 0; r < pvcState.rows; r++){
    for(let c = 0; c < pvcState.cols; c++){
      const cell = document.createElement('div');
      cell.className = 'pvc-cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      cell.addEventListener('click', () => pvcPlantOnCell(r, c));
      gridEl.appendChild(cell);
    }
  }

  pvcUpdateHud();
  pvcTickInterval = setInterval(pvcGameLoop, 50); 
  pvcSpawnInterval = setInterval(pvcSpawnCombi, 11000); 
  setTimeout(pvcSpawnCombi, 10000);
}

function pvcUpdateHud(){
  if(!pvcState) return;

  if(sunEl) sunEl.textContent = pvcState.sun;
}

function pvcPlantOnCell(r, c){
  if(!pvcState || !pvcState.running || pvcState.paused) return;
  const key = `${r}-${c}`;
  if(pvcState.plants[key]) return;

  const costs = { girasol: 50, lanzaguisantes: 100, papa: 50, leon: 150, eren: 300, pierrot: 75 };
  const cost = costs[pvcState.selectedSeed];

  if(pvcState.sun < cost) return; 

  pvcState.sun -= cost;
  pvcUpdateHud();

  // EREN: no se queda fijo en el casillero, nace ya transformado y camina cazando combis
  if(pvcState.selectedSeed === 'eren'){
    pvcState.friendlyUnits.push({
      id: pvcState.nextId++,
      kind: 'eren',
      row: r,
      xPct: 23 + (c + 0.5) * (75.5 / 9),
      hp: ZOMBISTEIN.hp,
      maxHp: ZOMBISTEIN.hp,
      dmgPerTick: ZOMBISTEIN.dmgPerTick,
      speed: ZOMBISTEIN.speed
    });
    return;
  }

  const hps = { girasol: 300, lanzaguisantes: 300, papa: 4000, leon: 330, pierrot: 300 };
  pvcState.plants[key] = {
    type: pvcState.selectedSeed,
    row: r,
    col: c,
    hp: hps[pvcState.selectedSeed],
    maxHp: hps[pvcState.selectedSeed],
    lastAction: Date.now()
  };
}

function pvcSpawnCombi(){
  if(!pvcState || !pvcState.running || pvcState.paused) return;
  const row = Math.floor(Math.random() * pvcState.rows);
  pvcState.combis.push({
    id: pvcState.nextId++,
    row: row,
    xPct: 102, 
    hp: 200,
    maxHp: 200,
    speed: 0.09
  });
}

function pvcSpawnSun(xPct, yPct){
  if(!pvcState) return;
  pvcState.suns.push({
    id: pvcState.nextId++,
    xPct: xPct,
    yPct: yPct,
    value: 50,
    expiresAt: Date.now() + 8000
  });
}

function pvcCollectSun(id){
  if(!pvcState || pvcState.paused) return;
  const idx = pvcState.suns.findIndex(s => s.id === id);
  if(idx > -1){
    pvcState.sun += pvcState.suns[idx].value;
    pvcState.suns.splice(idx, 1);
    pvcUpdateHud();
  }
}

/* BUCLE PRINCIPAL DEL JUEGO */
function pvcGameLoop(){
  if(!pvcState || !pvcState.running || pvcState.paused) return;
  const now = Date.now();

  // 1. Acciones de plantas
  Object.values(pvcState.plants).forEach(plant => {
    if(plant.type === 'girasol'){
      if(now - plant.lastAction >= 10000){
        plant.lastAction = now;
        const xPct = 23 + (plant.col + 0.5) * (75.5 / 9);
        const yPct = (plant.row + 0.5) * 20;
        pvcSpawnSun(xPct, yPct);
      }
    } else if(SHOOTER_CONFIG[plant.type]){
      const cfg = SHOOTER_CONFIG[plant.type];
      if(now - plant.lastAction >= cfg.cooldown){
        const hasEnemy = pvcState.combis.some(cb => cb.row === plant.row && cb.xPct > (23 + plant.col * (75.5 / 9)));
        if(hasEnemy){
          plant.lastAction = now;
          const startX = 23 + (plant.col + 0.6) * (75.5 / 9);
          pvcState.peas.push({
            id: pvcState.nextId++,
            row: plant.row,
            xPct: startX,
            damage: cfg.damage
          });
        }
      }
    }
  });

  // 2. Mover Guisantes
  for(let i = pvcState.peas.length - 1; i >= 0; i--){
    const pea = pvcState.peas[i];
    pea.xPct += 1.8;

    const hitCombi = pvcState.combis.find(cb => cb.row === pea.row && Math.abs(cb.xPct - pea.xPct) < 2.5);
    if(hitCombi){
      hitCombi.hp -= (pea.damage || 20);
      pvcState.peas.splice(i, 1);
      if(hitCombi.hp <= 0){
        const cIdx = pvcState.combis.indexOf(hitCombi);
        if(cIdx > -1) pvcState.combis.splice(cIdx, 1);
      }
    } else if(pea.xPct > 105){
      pvcState.peas.splice(i, 1);
    }
  }

  // 3. Mover y atacar Combis
  for(let i = pvcState.combis.length - 1; i >= 0; i--){
    const combi = pvcState.combis[i];
    
    let blocked = false;
    const colApprox = Math.floor((combi.xPct - 23) / (75.5 / 9));
    if(colApprox >= 0 && colApprox < 9){
      const key = `${combi.row}-${colApprox}`;
      const targetPlant = pvcState.plants[key];
      if(targetPlant){
        if(targetPlant.type === 'pierrot'){
          // PIERROT: un solo uso. Hipnotiza a la combi (cambia de bando y de dirección)
          // y se consume en el acto.
          delete pvcState.plants[key];
          pvcState.friendlyUnits.push({
            id: pvcState.nextId++,
            kind: 'hypno',
            row: combi.row,
            xPct: combi.xPct,
            hp: combi.maxHp,
            maxHp: combi.maxHp,
            dmgPerTick: COMBI_BITE_DMG,
            speed: combi.speed
          });
          pvcState.combis.splice(i, 1);
          continue;
        }
        blocked = true;
        targetPlant.hp -= 1.5; 
        if(targetPlant.hp <= 0){
          delete pvcState.plants[key];
        }
      }
    }

    // ¿Hay una unidad aliada (Eren o una combi hipnotizada) frenándola en su carril?
    if(!blocked){
      const friendlyBlocking = pvcState.friendlyUnits.some(u =>
        u.row === combi.row && u.xPct <= combi.xPct && (combi.xPct - u.xPct) < 4
      );
      if(friendlyBlocking) blocked = true;
    }

    if(!blocked){
      combi.xPct -= combi.speed;
    }

    if(combi.xPct <= 23){
      const mower = pvcState.mowers.find(m => m.row === combi.row);
      if(mower && !mower.used){
        mower.active = true;
      } else if(combi.xPct <= 16){
        pvcGameOver();
        return;
      }
    }
  }

  // 4. Mover Podadoras activas
  pvcState.mowers.forEach(mower => {
    if(mower.active){
      mower.xPct += 3.0; 
      for(let i = pvcState.combis.length - 1; i >= 0; i--){
        if(pvcState.combis[i].row === mower.row && pvcState.combis[i].xPct <= mower.xPct + 4){
          pvcState.combis.splice(i, 1);
        }
      }
      if(mower.xPct >= 105){
        mower.active = false;
        mower.used = true;
      }
    }
  });

  // 5. Mover y pelear con las Unidades Aliadas (Eren transformado / combis hipnotizadas)
  for(let i = pvcState.friendlyUnits.length - 1; i >= 0; i--){
    const unit = pvcState.friendlyUnits[i];

    // busca la combi enemiga más cercana en su mismo carril, delante de ella
    const target = pvcState.combis
      .filter(cb => cb.row === unit.row && cb.xPct >= unit.xPct - 1)
      .sort((a, b) => a.xPct - b.xPct)[0];

    if(target && (target.xPct - unit.xPct) < 4){
      // combate cuerpo a cuerpo: se hacen daño mutuo mientras estén trabadas
      target.hp -= unit.dmgPerTick;
      unit.hp -= COMBI_BITE_DMG;

      if(target.hp <= 0){
        const cIdx = pvcState.combis.indexOf(target);
        if(cIdx > -1) pvcState.combis.splice(cIdx, 1);
      }
    } else {
      unit.xPct = Math.min(unit.xPct + unit.speed, 98);
    }

    if(unit.hp <= 0){
      pvcState.friendlyUnits.splice(i, 1);
    }
  }

  // 6. Limpiar soles expirados
  pvcState.suns = pvcState.suns.filter(s => Date.now() < s.expiresAt);

  // Renderizar la escena
  pvcRenderEntities();
}

/* Actualiza una capa de entidades reutilizando los nodos existentes en vez de
   destruirlos y crearlos de nuevo (eso era lo que rompía el click en los soles) */
function pvcSyncLayer(map, container, items, keyFn, createEl, updateEl){
  const seen = new Set();
  items.forEach(item => {
    const key = String(keyFn(item)); // Object.keys() siempre da strings; forzamos el mismo tipo aquí
    seen.add(key);
    let el = map[key];
    if(!el){
      el = createEl(item);
      map[key] = el;
      container.appendChild(el);
    }
    updateEl(el, item);
  });
  Object.keys(map).forEach(key => {
    if(!seen.has(key)){
      map[key].remove();
      delete map[key];
    }
  });
}

/* RENDERIZADO VISUAL DE ENTIDADES */
function pvcRenderEntities(){
  const container = document.getElementById('pvcEntities');
  if(!container || !pvcState) return;

  const icons = { girasol: '🌻', lanzaguisantes: '🌱', papa: '🥔', leon: '🔫', pierrot: '🎭' };

  // PLANTAS
  pvcSyncLayer(
    pvcPlantEls, container, Object.entries(pvcState.plants),
    ([key]) => key,
    ([, p]) => {
      const el = document.createElement('div');
      el.className = `pvc-plant sprite-${p.type}`;
      el.textContent = icons[p.type] || '';
      return el;
    },
    (el, [, p]) => {
      el.style.left = (23 + (p.col + 0.5) * (75.5 / 9)) + '%';
      el.style.top = ((p.row + 0.5) * 20) + '%';
    }
  );

  // COMBIS
  pvcSyncLayer(
    pvcCombiEls, container, pvcState.combis,
    cb => cb.id,
    () => {
      const el = document.createElement('div');
      el.className = 'pvc-combi sprite-combi';
      el.textContent = '🚐';
      return el;
    },
    (el, cb) => {
      el.style.left = cb.xPct + '%';
      el.style.top = ((cb.row + 0.5) * 20) + '%';
    }
  );

  // PODADORAS (solo mientras no se hayan usado)
  pvcSyncLayer(
    pvcMowerEls, container, pvcState.mowers.filter(m => !m.used),
    m => m.row,
    () => {
      const el = document.createElement('div');
      el.className = 'pvc-mower sprite-podadora';
      el.textContent = '🚜';
      return el;
    },
    (el, m) => {
      el.style.left = m.xPct + '%';
      el.style.top = ((m.row + 0.5) * 20) + '%';
    }
  );

  // GUISANTES (proyectiles)
  pvcSyncLayer(
    pvcPeaEls, container, pvcState.peas,
    pea => pea.id,
    () => {
      const el = document.createElement('div');
      el.className = 'pvc-pea sprite-guisante';
      return el;
    },
    (el, pea) => {
      el.style.left = pea.xPct + '%';
      el.style.top = ((pea.row + 0.5) * 20) + '%';
    }
  );

  // SOLES (el listener se agrega UNA sola vez al crear el nodo, no en cada tick)
  pvcSyncLayer(
    pvcSunEls, container, pvcState.suns,
    s => s.id,
    s => {
      const el = document.createElement('div');
      el.className = 'pvc-sun sprite-sol';
      el.textContent = '☀️';
      el.addEventListener('click', () => pvcCollectSun(s.id));
      return el;
    },
    (el, s) => {
      el.style.left = s.xPct + '%';
      el.style.top = s.yPct + '%';
    }
  );

  // UNIDADES ALIADAS (Eren transformado / combis hipnotizadas por Pierrot)
  pvcSyncLayer(
    pvcFriendlyEls, container, pvcState.friendlyUnits,
    u => u.id,
    u => {
      const el = document.createElement('div');
      if(u.kind === 'eren'){
        el.className = 'pvc-eren-titan sprite-eren-titan';
        el.textContent = '⚔️';
      } else {
        el.className = 'pvc-hypno-combi sprite-combi';
        el.textContent = '🚐';
      }
      return el;
    },
    (el, u) => {
      el.style.left = u.xPct + '%';
      el.style.top = ((u.row + 0.5) * 20) + '%';
    }
  );
}

function pvcGameOver(){
  if(!pvcState) return;
  pvcState.running = false;
  pvcStopGame();
  const statusEl = document.getElementById('pvcStatus');
  if(statusEl) statusEl.textContent = '¡Las combis ingresaron a la casa! Toca "Reiniciar" para volver a intentarlo.';
}
